name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test-and-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install toolchain and test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu libc6-dev-arm64-cross zip
          sudo apt-get install -y --no-install-recommends qemu-user-static || \
            sudo apt-get install -y --no-install-recommends qemu-user qemu-user-binfmt

      - name: Lint shell scripts and WebUI JS
        run: |
          for f in customize.sh post-fs-data.sh service.sh action.sh uninstall.sh lib/qc.sh; do
            sh -n "$f"
          done
          node -e '
            const fs = require("fs"), vm = require("vm");
            const html = fs.readFileSync("webroot/index.html", "utf8");
            const m = html.match(/<script>([\s\S]*?)<\/script>/);
            if (!m) throw new Error("Missing <script>");
            new vm.Script(m[1], { filename: "webroot/index.html" });
          '

      - name: Run unit tests
        run: |
          for t in chg-unit cool-unit mount-unit zone-rank; do
            echo "=== $t ==="
            sh "tests/$t.sh"
          done
          echo "=== state-unit ==="
          sudo sh tests/state-unit.sh

      - name: Cross-compile phone arm64 qcmon and run c-test
        run: |
          sh build-qcmon.sh arm64 /tmp/qcmon-arm64
          QEMU=$(command -v qemu-aarch64-static || command -v qemu-aarch64)
          sudo sh tests/c-test.sh "$QEMU /tmp/qcmon-arm64"

      - name: Package flashable module zip
        run: |
          VER=$(sed -n 's/^version=//p' module.prop | head -n 1)
          ZIP="QuickCharge-v${VER}.zip"
          zip -r9 "$ZIP" META-INF lib webroot customize.sh post-fs-data.sh service.sh action.sh uninstall.sh module.prop LICENSE
          echo "ZIP_NAME=$ZIP" >> "$GITHUB_ENV"

      - name: Upload module artifact
        uses: actions/upload-artifact@v4
        with:
          name: QuickCharge-shell-module
          path: ${{ env.ZIP_NAME }}
          if-no-files-found: error
